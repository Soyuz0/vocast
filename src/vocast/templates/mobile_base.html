<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>{% block title %}Vocast{% endblock %}</title>
<style>
/* Palette shared with /library so the two surfaces read as one product; the
   type and metrics are iOS rather than the design system's, because this page
   is trying to feel like a native list view. No webfont: the point is the
   system stack, and the tailnet has no route to a font CDN anyway. */
:root {
  --bg-1:#14141D; --bg-2:#212029; --bg-3:#2C2B34; --bg-4:#414048;
  --text-white:#FFF; --text-grey:#808080; --text-dark-grey:#4F4F4F;
  --tint:#72BBFF; --accent:#4037F0; --star:#F5963D; --success:#34C5A2; --error:#F86060;
  --hairline:rgba(255,255,255,.09);
  --chrome:rgba(20,20,29,.82);
  --font-ios:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
  --toolbar-height:50px;
  --ease-ios:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box}
html{background:var(--bg-1);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg-1);color:var(--text-white);
  font-family:var(--font-ios);font-size:17px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  -webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--toolbar-height) + env(safe-area-inset-bottom) + 8px);
}
a{color:var(--tint);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--tint);outline-offset:-2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---- navigation bar: translucent, sticky, large title underneath ---- */
.nav{position:sticky;top:0;z-index:4;background:var(--chrome);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--hairline);padding-top:env(safe-area-inset-top)}
.nav .bar{display:flex;align-items:center;min-height:44px;padding:0 6px}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 10px 0 4px;
  color:var(--tint);font-size:17px}
.back .chev{display:block;width:11px;height:11px;border-left:2.5px solid currentColor;
  border-bottom:2.5px solid currentColor;transform:rotate(45deg);margin-right:3px}
.nav .bartitle{font-size:17px;font-weight:600;margin:0 auto;padding:0 8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.largetitle{margin:0;padding:2px 16px 10px;font-size:34px;line-height:41px;
  font-weight:700;letter-spacing:-.02em}
.nav.plain .largetitle{padding-top:12px}
.subtitle{padding:0 16px 12px;margin:-6px 0 0;color:var(--text-grey);font-size:14px}

/* ---- grouped list, page one ---- */
.group{margin:18px 16px 0}
.group h2{margin:0 0 7px 16px;font-size:13px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text-grey)}
.card{background:var(--bg-2);border-radius:12px;overflow:hidden}
.item{position:relative;display:flex;align-items:center;gap:12px;min-height:48px;
  padding:11px 14px;color:var(--text-white)}
.item:active{background:var(--bg-3)}
/* Hairlines inset from the leading edge, so the separator starts where the
   label does rather than cutting the icon column in half. */
.item + .item::before{content:"";position:absolute;left:48px;right:0;top:0;height:1px;
  background:var(--hairline)}
.item .glyph{width:22px;flex:none;text-align:center;font-size:17px;color:var(--tint)}
.item .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .n{color:var(--text-grey);font-size:15px;font-variant-numeric:tabular-nums}
.item .disclosure{width:8px;height:8px;flex:none;border-top:2px solid var(--text-dark-grey);
  border-right:2px solid var(--text-dark-grey);transform:rotate(45deg)}

/* ---- bottom toolbar ---- */
.toolbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--chrome);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--hairline);padding-bottom:env(safe-area-inset-bottom)}
.toolbar .bar{position:relative;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;height:var(--toolbar-height);padding:0 8px}
.toolbar .status{font-size:12px;color:var(--text-grey);padding-left:8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.filter{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:34px;min-width:112px;padding:0 14px;border-radius:999px;
  background:var(--bg-3);color:var(--text-white);font-size:14px;font-weight:600}
.filter:active{background:var(--bg-4)}
.filter .swatch{width:9px;height:9px;border-radius:50%;background:var(--tint)}
.filter[data-filter="read"] .swatch{background:var(--text-dark-grey)}
.filter[data-filter="all"] .swatch{background:var(--success)}
.searchpop{justify-self:end}
.searchpop>summary{display:flex;align-items:center;justify-content:center;
  width:44px;height:44px;list-style:none;color:var(--tint);cursor:pointer}
.searchpop>summary::-webkit-details-marker{display:none}
.searchpop>summary:active{opacity:.5}
.glass{display:block;width:15px;height:15px;border:2px solid currentColor;border-radius:50%;
  position:relative}
.glass::after{content:"";position:absolute;right:-6px;bottom:-4px;width:8px;height:2px;
  background:currentColor;transform:rotate(45deg);border-radius:2px}
.pop{position:absolute;left:8px;right:8px;bottom:calc(100% + 6px);background:var(--bg-2);
  border:1px solid var(--hairline);border-radius:12px;padding:8px;
  box-shadow:0 8px 30px rgba(0,0,0,.55)}
.pop form{display:flex;gap:8px}
.pop input[type="search"]{flex:1;min-width:0;height:40px;padding:0 12px;border-radius:10px;
  border:1px solid var(--hairline);background:var(--bg-3);color:var(--text-white);
  font-family:inherit;font-size:16px}
.pop input::placeholder{color:var(--text-grey)}
.pop button[type="submit"]{min-height:40px;padding:0 14px;border-radius:10px;
  background:var(--accent);color:#fff;font-size:15px;font-weight:600}
.pop .clear{align-self:center;padding:0 8px;color:var(--tint);font-size:14px}

.empty{margin:64px 24px;text-align:center;color:var(--text-grey)}
.empty strong{display:block;color:var(--text-white);font-size:20px;margin-bottom:6px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
{% block styles %}{% endblock %}
</style>
</head>
<body data-base-path="{{ base_path }}">
{% block header %}{% endblock %}
{% block content %}{% endblock %}

<nav class="toolbar" aria-label="Library controls">
  <div class="bar">
    <span class="status">{% block toolbar_status %}{% endblock %}</span>
    <a class="filter" data-filter="{{ active_filter }}" href="{{ filter_url }}"
       aria-label="Showing {{ filter_label|lower }} articles. Activate to change the filter.">
      <span class="swatch" aria-hidden="true"></span>{{ filter_label }}
    </a>
    <details class="searchpop" data-searchpop {% if search_value %}open{% endif %}>
      <summary aria-label="Search"><span class="glass" aria-hidden="true"></span></summary>
      <div class="pop">
        <form method="get" action="{{ search_action }}" role="search">
          {% for name, value in search_hidden.items() %}
          <input type="hidden" name="{{ name }}" value="{{ value }}">
          {% endfor %}
          <label class="sr" for="mobile-search">Search articles</label>
          <input id="mobile-search" type="search" name="search" value="{{ search_value }}"
                 placeholder="Search articles" autocomplete="off" autocapitalize="none">
          <button type="submit">Search</button>
          {% if search_value %}
          <a class="clear" href="{{ search_action }}?filter={{ active_filter }}">Clear</a>
          {% endif %}
        </form>
      </div>
    </details>
  </div>
</nav>

<script>
(function () {
  // The search panel is a <details>, so it opens without JS. With JS it also
  // takes the caret, which is what the magnifying glass implies.
  var pop = document.querySelector('[data-searchpop]');
  if (pop) pop.addEventListener('toggle', function () {
    if (pop.open) pop.querySelector('input[type="search"]').focus();
  });
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
